name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Справжня Postgres з pgvector: інтеграційні тести src/pgstore.py
      # (локально вони пропускаються, якщо PGVECTOR_DSN не задано).
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kb
          POSTGRES_PASSWORD: kb
          POSTGRES_DB: kb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      # Як у Dockerfile.tests: без sentence-transformers, бо він тягне torch,
      # а тести на справжні ваги не спираються.
      - run: |
          grep -v -i "sentence-transformers" requirements.txt > requirements-tests.txt
          pip install -r requirements-tests.txt
      # Та сама стеля, що й у локальному раннері: тест, що зациклився, падає, а не з'їдає VM.
      - name: pytest (memory capped at 1 GB)
        env:
          PGVECTOR_DSN: postgresql://kb:kb@localhost:5432/kb
        run: |
          ulimit -v 1048576
          python -m pytest -q --no-header -p no:cacheprovider
