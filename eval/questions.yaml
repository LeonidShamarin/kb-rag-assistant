# Golden-набір для оцінки якості.
#
# Типи питань:
#   factual      — відповідь є в одному документі
#   multi        — відповідь вимагає двох документів одночасно
#   inflected    — те саме, що factual, але питання свідомо в іншій відмінковій
#                  формі, ніж документ (перевірка стемінгу для BM25)
#   out_of_scope — відповіді в базі НЕМАЄ, правильна поведінка = відмова
